name: Build and Push to Hugging Face
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Tải và giải nén Model
        run: |
          wget https://huggingface.co/Huy1223/datamate_models/resolve/main/qwen_sql_merged_4bit.zip
          unzip qwen_sql_merged_4bit.zip
          rm qwen_sql_merged_4bit.zip

      - name: Build Docker Image
        run: docker build -t zalo_dataspace:v8 .  # <-- ĐÃ SỬA THÀNH v8

      - name: Save Docker Image to Tar
        run: docker save -o zalo_dataspace_v8.tar zalo_dataspace:v8

      # 🌟 TÍNH MÃ MD5 VÀ LƯU RA FILE
      - name: Tính mã MD5
        run: |
          md5sum zalo_dataspace_v8.tar > checksum.md5
          echo "Mã MD5 của bạn là:"
          cat checksum.md5

      # 🌟 UPLOAD CẢ FILE .TAR VÀ FILE CHECKSUM LÊN HUGGING FACE
      - name: Upload to Hugging Face
        run: |
          pip install "huggingface_hub[hf_transfer]"
          python -c "
          from huggingface_hub import HfApi
          import os
          os.environ['HF_HUB_ENABLE_HF_TRANSFER'] = '1'
          api = HfApi()
          
          print('Đang bắt đầu upload file 11GB lên Hugging Face...')
          api.upload_file(
              path_or_fileobj='zalo_dataspace_v8.tar',
              path_in_repo='zalo_dataspace_v8.tar',
              repo_id='Huy1223/zalo_submit_htk',
              repo_type='dataset',
              token=os.environ['HF_TOKEN']
          )
          
          print('Đang upload file checksum.md5...')
          api.upload_file(
              path_or_fileobj='checksum.md5',
              path_in_repo='checksum.md5',
              repo_id='Huy1223/zalo_submit_htk',
              repo_type='dataset',
              token=os.environ['HF_TOKEN']
          )
          print('✅ Upload thành công cả 2 file!')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}