name: Build and Push to Hugging Face
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Tải và giải nén Model
        run: |
          wget https://huggingface.co/Huy1223/datamate_models/resolve/main/qwen_sql_merged_4bit.zip
          unzip qwen_sql_merged_4bit.zip
          rm qwen_sql_merged_4bit.zip

      - name: Build Docker Image
        run: docker build -t zalo_dataspace:v6 .  # <-- Đổi thành v6

      - name: Save Docker Image to Tar
        run: docker save -o zalo_dataspace_v6.tar zalo_dataspace:v6  # <-- Đổi thành v6

      - name: Upload to Hugging Face
        run: |
          pip install "huggingface_hub[hf_transfer]"
          python -c "
          from huggingface_hub import HfApi
          import os
          os.environ['HF_HUB_ENABLE_HF_TRANSFER'] = '1'
          api = HfApi()
          print('Đang bắt đầu upload file 11GB lên Hugging Face...')
          api.upload_file(
              path_or_fileobj='zalo_dataspace_v6.tar',  # <-- Đổi thành v6
              path_in_repo='zalo_dataspace_v6.tar',     # <-- Đổi thành v6
              repo_id='Huy1223/zalo_submit_htk',
              repo_type='dataset',
              token=os.environ['HF_TOKEN']
          )
          print('✅ Upload thành công!')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}