name: Build and Push to Hugging Face
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Tải và giải nén Model
        run: |
          wget https://huggingface.co/Huy1223/datamate_models/resolve/main/qwen_sql_merged_4bit.zip
          unzip qwen_sql_merged_4bit.zip
          rm qwen_sql_merged_4bit.zip

      - name: Build Docker Image
        run: docker build -t zalo_dataspace:v5 .

      - name: Save Docker Image to Tar
        run: docker save -o zalo_dataspace_v5.tar zalo_dataspace:v5

      # BƯỚC TỰ ĐỘNG ĐẨY LÊN HUGGING FACE
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          huggingface-cli upload Huy1223/zalo_submit_htk zalo_dataspace_v5.tar zalo_dataspace_v5.tar --repo-type dataset